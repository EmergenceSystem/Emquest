<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergence</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Ambient background -->
    <canvas id="bg-canvas"></canvas>

    <!-- ── Sticky header with search ─────────────────────────────── -->
    <header class="app-header" id="app-header">
        <div class="header-inner">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-mark">
                    <span class="logo-dot"></span>
                    <span class="logo-dot"></span>
                    <span class="logo-dot"></span>
                </div>
                <span class="logo-name">EMERGENCE</span>
                <span class="logo-tag">distributed</span>
            </div>

            <!-- Search area — textarea + button -->
            <div class="search-zone">
                <div class="search-box" id="search-box">
                    <textarea
                        id="query-input"
                        class="query-input"
                        placeholder="Ask anything — search, DNS, knowledge..."
                        rows="1"
                        autocomplete="off"
                        spellcheck="false"
                    ></textarea>
                    <button class="send-btn" id="send-btn" aria-label="Send">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <!-- Status line below search box -->
                <div class="search-meta" id="search-meta">
                    <span class="meta-hint">↵ send &nbsp;·&nbsp; shift+↵ newline</span>
                    <span class="meta-status" id="meta-status"></span>
                </div>
            </div>

            <!-- System status -->
            <div class="sys-status">
                <a href="/drift" class="drift-link">drift ↗</a>
                <span class="pulse-dot"></span>
                <span id="clock" class="clock"></span>
            </div>

        </div>
    </header>

    <!-- ── Main content ───────────────────────────────────────────── -->
    <main class="main" id="main">

        <!-- Empty state -->
        <div class="empty-state" id="empty-state">
            <div class="empty-grid">
                <div class="empty-cell">web search</div>
                <div class="empty-cell">DNS lookup</div>
                <div class="empty-cell">knowledge</div>
                <div class="empty-cell">synthesis</div>
            </div>
            <p class="empty-hint">All agents stand by.</p>
        </div>

        <!-- Results area — populated by JS -->
        <div class="results" id="results" hidden></div>

    </main>

    <!-- ── Footer ────────────────────────────────────────────────── -->
    <footer class="app-footer">
        <span class="footer-name">EMERGENCE</span>
        <span class="footer-sep">·</span>
        <span id="footer-agent-count" class="footer-info">agents loading…</span>
        <span class="footer-sep">·</span>
        <a href="/drift" class="footer-info footer-drift">em_drift ↗</a>
        <span class="footer-sep">·</span>
        <span class="footer-info">v2.2.0</span>
    </footer>

    <script src="/static/emergence.js"></script>
</body>
</html>
