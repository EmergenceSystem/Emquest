<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em_drift — Emergence</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Drift-specific overrides ──────────────────────────────── */
        .drift-header {
            position: sticky; top: 0; z-index: 200;
            background: rgba(6,10,8,0.94);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
            padding: 0 2rem;
            height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            transition: box-shadow 0.3s var(--ease);
        }
        .drift-header.scrolled { box-shadow: 0 4px 40px rgba(0,220,100,0.05); }

        .drift-logo {
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.8rem; font-weight: 600; letter-spacing: 0.2em;
            color: var(--green); text-decoration: none;
        }
        .drift-logo span { color: var(--muted); font-weight: 300; }

        .drift-topics {
            display: flex; align-items: center; gap: 0.5rem;
            overflow-x: auto; scrollbar-width: none; flex: 1;
            padding: 0 1.5rem;
        }
        .drift-topics::-webkit-scrollbar { display: none; }

        .topic-chip {
            flex-shrink: 0;
            font-family: var(--font-mono); font-size: 0.68rem;
            letter-spacing: 0.06em; color: var(--muted);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 0.25rem 0.8rem;
            cursor: pointer; user-select: none;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .topic-chip:hover,
        .topic-chip.active {
            color: var(--green); border-color: var(--border-hi);
            background: var(--surface-2);
        }
        .topic-chip.active { box-shadow: 0 0 0 1px var(--green-glow); }

        .drift-sys {
            display: flex; align-items: center; gap: 0.6rem;
            flex-shrink: 0;
        }
        .pulse-dot {
            display: block; width: 7px; height: 7px;
            background: var(--green); border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 6px var(--green);
        }
        .drift-clock { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

        /* ── Feed ────────────────────────────────────────────────── */
        .drift-feed {
            max-width: 680px; margin: 0 auto;
            padding: 1.5rem 1rem 6rem;
            display: flex; flex-direction: column; gap: 1px;
        }

        /* ── Drift card ──────────────────────────────────────────── */
        .drift-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: 10px;
            padding: 1.1rem 1.25rem;
            cursor: pointer;
            opacity: 0; transform: translateY(10px);
            animation: cardIn 0.3s var(--ease) forwards;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 0.6rem;
        }
        .drift-card:hover {
            border-color: var(--border-hi);
            background: var(--surface-2);
        }
        .drift-card.active-topic-0 { border-left-color: var(--green); }
        .drift-card.active-topic-1 { border-left-color: var(--blue); }
        .drift-card.active-topic-2 { border-left-color: var(--amber); }
        .drift-card.active-topic-3 { border-left-color: rgba(245,75,75,0.7); }
        .drift-card.active-topic-4 { border-left-color: rgba(180,100,245,0.7); }

        .card-topic-tag {
            font-size: 0.6rem; letter-spacing: 0.1em; font-weight: 600;
            color: var(--muted); margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .card-title {
            font-family: var(--font-sans); font-size: 0.97rem; font-weight: 600;
            color: var(--text-primary); line-height: 1.35;
            margin-bottom: 0.3rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .drift-card:hover .card-title { color: var(--blue); }

        .card-url {
            font-size: 0.7rem; color: var(--text-url); font-family: var(--font-mono);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 0.5rem; opacity: 0.85;
        }

        .card-preview {
            font-family: var(--font-sans); font-size: 0.85rem;
            line-height: 1.6; color: var(--text-secondary);
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; min-height: 1.2rem;
        }

        /* skeleton shimmer while preview loads */
        .card-preview.loading {
            background: linear-gradient(90deg,
                var(--surface-2) 25%, rgba(0,220,100,0.06) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px; color: transparent;
            height: 3.2rem;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* ── Keyboard focus ─────────────────────────────────────── */
        .drift-card.card-focused {
            border-color: var(--border-hi);
            background: var(--surface-2);
            box-shadow: 0 0 0 2px var(--green-glow);
        }
        .drift-card.card-focused .card-title { color: var(--blue); }

        /* ── Drag cursor ─────────────────────────────────────────── */
        .drift-feed { cursor: grab; }
        .drift-feed.dragging { cursor: grabbing; user-select: none; }

        /* ── Open button (desktop only) ─────────────────────────── */
        .card-open-btn {
            display: none; /* hidden by default, shown on pointer:fine */
            position: absolute; top: 0.75rem; right: 0.75rem;
            width: 28px; height: 28px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 6px; color: var(--muted);
            font-size: 0.8rem; cursor: pointer;
            align-items: center; justify-content: center;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
            flex-shrink: 0;
        }
        .drift-card { position: relative; }
        @media (pointer: fine) {
            .card-open-btn { display: flex; }
            .drift-card:hover .card-open-btn {
                color: var(--blue); border-color: var(--border-hi);
                background: var(--surface);
            }
        }

        /* ── Load sentinel ───────────────────────────────────────── */
        .drift-sentinel {
            height: 60px; display: flex; align-items: center; justify-content: center;
        }
        .sentinel-dots span {
            display: inline-block; width: 5px; height: 5px;
            background: var(--muted); border-radius: 50%; margin: 0 3px;
            animation: sentinelBounce 1.2s ease-in-out infinite;
        }
        .sentinel-dots span:nth-child(2) { animation-delay: 0.2s; }
        .sentinel-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes sentinelBounce {
            0%,80%,100% { transform: scale(0.6); opacity: 0.3; }
            40%          { transform: scale(1);   opacity: 1;   }
        }

        /* ── Footer ──────────────────────────────────────────────── */
        .app-footer {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: rgba(6,10,8,0.92); border-top: 1px solid var(--border);
            padding: 0 2rem; height: 36px;
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.68rem; color: var(--muted);
            backdrop-filter: blur(10px);
        }
        .footer-name { font-weight: 600; letter-spacing: 0.12em; }
        .footer-sep  { opacity: 0.4; }

        /* ── Theme management (chips + add panel) ─────────────────── */
        .topic-chip { display: inline-flex; align-items: center; gap: 4px; }
        .chip-label { cursor: pointer; }
        .chip-x {
            background: none; border: none; color: var(--muted);
            font-size: 0.9rem; line-height: 1; padding: 0 1px; cursor: pointer;
            opacity: 0; transition: opacity 0.15s, color 0.15s;
        }
        .topic-chip:hover .chip-x { opacity: 0.65; }
        .chip-x:hover { color: rgba(245,75,75,0.95); opacity: 1; }
        .topic-add {
            flex-shrink: 0; font-family: var(--font-mono); font-size: 0.85rem;
            color: var(--muted); background: var(--surface);
            border: 1px dashed var(--border-hi); border-radius: 20px;
            width: 24px; height: 24px; line-height: 1; cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .topic-add:hover { color: var(--green); border-color: var(--green); }
        .topic-panel {
            position: fixed; z-index: 300; width: 280px;
            background: var(--surface-2); border: 1px solid var(--border-hi);
            border-radius: 10px; padding: 0.8rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.45);
            display: flex; flex-direction: column; gap: 0.6rem;
        }
        .topic-panel-input {
            width: 100%; box-sizing: border-box;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; padding: 0.4rem 0.6rem;
            color: var(--text-primary); font-family: var(--font-mono); font-size: 0.8rem;
        }
        .topic-panel-input:focus { outline: none; border-color: var(--green); }
        .topic-suggest { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .suggest-chip {
            font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 0.2rem 0.6rem; cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .suggest-chip:hover { color: var(--green); border-color: var(--border-hi); }

        /* ── Media-type filter bar ────────────────────────────────── */
        .drift-typebar {
            position: sticky; top: 56px; z-index: 150;
            background: rgba(6,10,8,0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            display: flex; gap: 16px; align-items: center;
            padding: 8px 2rem; font-size: 0.7rem; letter-spacing: 0.05em;
        }
        .drift-typebar label {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--muted); cursor: pointer; text-transform: uppercase;
            user-select: none; transition: color 0.15s;
        }
        .drift-typebar label:hover { color: rgba(0,220,100,0.85); }
        .drift-typebar input { accent-color: var(--green); cursor: pointer; }
        .drift-card.type-hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header class="drift-header" id="drift-header">
        <a class="drift-logo" href="/">EMERGENCE <span>/ drift</span></a>

        <nav class="drift-topics" id="drift-topics" aria-label="Topics"></nav>

        <div class="drift-sys">
            <span class="pulse-dot"></span>
            <span id="clock" class="drift-clock"></span>
        </div>
    </header>

    <div class="drift-typebar" id="drift-typebar">
        <label><input type="checkbox" value="text" checked> text</label>
        <label><input type="checkbox" value="image" checked> image</label>
        <label><input type="checkbox" value="audio" checked> audio</label>
        <label><input type="checkbox" value="video" checked> video</label>
    </div>

    <main class="drift-feed" id="drift-feed"></main>

    <div class="drift-sentinel" id="drift-sentinel">
        <div class="sentinel-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <footer class="app-footer">
        <span class="footer-name">EMERGENCE</span>
        <span class="footer-sep">·</span>
        <span class="footer-sep">em_drift</span>
        <span class="footer-sep">·</span>
        <span id="footer-count" class="footer-info">0 items</span>
    </footer>

    <script src="/static/drift.js?v=3"></script>
</body>
</html>
