<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emquest · Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        :root {
            /* ── Terminal Glass design tokens ─────────────────────── */
            --bg:            #04060a;
            --neon:          #00ffa2;
            --text:          #daffee;
            --muted:         #6fbf9e;
            --glass:         rgba(0, 28, 20, 0.42);
            --glass-brd:     rgba(0, 255, 160, 0.22);

            /* ── Legacy aliases (kept so every component rule below
               still resolves without a rewrite of every selector) ──── */
            --surface:      var(--glass);
            --surface-2:    rgba(0, 42, 30, 0.55);
            --border:       var(--glass-brd);
            --border-hi:    rgba(0, 255, 160, 0.5);
            --green:        var(--neon);
            --green-dim:    #00cc82;
            --green-glow:   rgba(0, 255, 160, 0.18);
            --blue:         #3dd6f5;
            --amber:        #f5a623;
            --red:          #f54b4b;
            --text-primary: var(--text);
            --text-sec:     rgba(218, 255, 238, 0.72);
            --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
            --font-sans:    'IBM Plex Sans', system-ui, sans-serif;
            --ease:         cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { font-size: 15px; -webkit-font-smoothing: antialiased; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ── Ambient background: canvas + aurora + scanlines ──────── */
        #bg-canvas {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0.6;
        }

        body::before {
            content: "";
            position: fixed; inset: -30%;
            z-index: 0; pointer-events: none;
            filter: blur(80px); opacity: 0.5;
            background:
                radial-gradient(38% 38% at 72% 30%, var(--neon) 0%, transparent 60%),
                radial-gradient(34% 34% at 28% 72%, #00b3ff 0%, transparent 60%),
                radial-gradient(30% 30% at 85% 80%, #12ffcf 0%, transparent 62%);
            animation: auroraDrift 18s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift { to { transform: translate(-3%, 3%) scale(1.08); } }

        body::after {
            content: "";
            position: fixed; inset: 0;
            z-index: 40; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 160, 0.035) 0 1px, transparent 1px 3px);
        }

        @media (prefers-reduced-motion: reduce) {
            body::before { animation: none; }
        }

        /* ── Layout ─────────────────────────────────────────────── */
        .page {
            position: relative; z-index: 10;
            max-width: 900px; margin: 0 auto;
            padding: 3rem 2rem 6rem;
        }

        /* ── Header ─────────────────────────────────────────────── */
        .header {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 2rem;
            border: 1px solid var(--border);
            padding: 1.25rem 1.5rem;
            margin-bottom: 2.5rem;
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(1.3);
            border-radius: 14px;
        }

        .logo { display: flex; align-items: center; gap: 0.85rem; }
        .logo-mark { display: flex; flex-direction: column; gap: 3px; }
        .logo-dot {
            display: block; width: 6px; height: 6px;
            background: var(--green); border-radius: 50%;
            animation: logoBreath 3s ease-in-out infinite;
        }
        .logo-dot:nth-child(2) { animation-delay: 0.4s; opacity: 0.7; }
        .logo-dot:nth-child(3) { animation-delay: 0.8s; opacity: 0.45; }
        @keyframes logoBreath { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        .logo-text { display: flex; flex-direction: column; gap: 2px; }
        .logo-name {
            font-size: 1.1rem; font-weight: 600;
            letter-spacing: 0.2em; color: var(--green);
        }
        .logo-sub {
            font-size: 0.68rem; color: var(--muted);
            letter-spacing: 0.12em;
        }

        .header-right { text-align: right; }
        .pulse-row { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-bottom: 0.3rem; }
        .pulse-dot {
            display: block; width: 7px; height: 7px;
            background: var(--green); border-radius: 50%;
            box-shadow: 0 0 6px var(--green);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; box-shadow: 0 0 6px var(--green); }
            50%      { opacity:0.4; box-shadow: none; }
        }
        .status-label { font-size: 0.7rem; color: var(--green); letter-spacing: 0.1em; }
        .clock { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.05em; }

        /* ── Stats row ───────────────────────────────────────────── */
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 1px; margin-bottom: 2.5rem;
            border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
            backdrop-filter: blur(14px) saturate(1.2);
        }
        .stat {
            background: var(--surface);
            padding: 1.1rem 1.25rem;
            border-right: 1px solid var(--border);
        }
        .stat:last-child { border-right: none; }
        .stat-value {
            font-size: 1.6rem; font-weight: 600;
            color: var(--green); line-height: 1;
            margin-bottom: 0.3rem;
        }
        .stat-label {
            font-size: 0.65rem; color: var(--muted);
            letter-spacing: 0.1em; text-transform: uppercase;
        }

        /* ── Section title ───────────────────────────────────────── */
        .section-title {
            font-size: 0.65rem; font-weight: 600;
            letter-spacing: 0.2em; color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.75rem;
        }
        .section-title::after {
            content: ''; flex: 1; height: 1px;
            background: var(--border);
        }

        /* ── Peer grid ───────────────────────────────────────────── */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .agent-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--green-dim);
            border-radius: 10px;
            padding: 1rem 1.1rem;
            backdrop-filter: blur(14px) saturate(1.2);
            opacity: 0; transform: translateY(8px);
            animation: cardIn 0.28s var(--ease) forwards;
            transition: border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }
        .agent-card:hover {
            border-color: var(--border-hi);
            background: var(--surface-2);
            box-shadow: 0 20px 44px -24px rgba(0, 255, 160, 0.4);
        }
        .agent-card--gossip { border-left-color: var(--muted); }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        .agent-name {
            font-size: 0.88rem; font-weight: 500;
            color: var(--text-primary); margin-bottom: 0.5rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .agent-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--green); flex-shrink: 0;
            box-shadow: 0 0 4px var(--green);
        }
        .agent-dot--gossip {
            background: var(--muted); box-shadow: none;
        }

        .caps { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.6rem; }
        .cap {
            font-size: 0.62rem; letter-spacing: 0.06em;
            color: var(--blue);
            background: rgba(61, 214, 245, 0.07);
            border: 1px solid rgba(61, 214, 245, 0.18);
            border-radius: 3px; padding: 0.1rem 0.4rem;
        }
        .cap--gossip {
            color: var(--muted);
            background: transparent;
            border-color: var(--border);
        }
        .agent-addr {
            font-size: 0.65rem; color: var(--muted);
            letter-spacing: 0.03em; font-family: var(--font-mono);
        }

        /* ── Error state ─────────────────────────────────────────── */
        .error-msg {
            background: rgba(245,75,75,0.06);
            border: 1px solid rgba(245,75,75,0.28);
            border-radius: 10px; padding: 1.25rem 1.5rem;
            color: var(--red); font-size: 0.85rem;
            backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 0.75rem;
        }

        /* ── Footer ──────────────────────────────────────────────── */
        .app-footer {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0, 14, 10, 0.82);
            border-top: 1px solid var(--border);
            padding: 0 2rem; height: 36px;
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.68rem; color: var(--muted);
            backdrop-filter: blur(14px) saturate(1.2);
        }
        .footer-name { font-weight: 600; letter-spacing: 0.12em; }
        .footer-sep  { opacity: 0.4; }
        .footer-link { color: var(--muted); text-decoration: none; transition: color 0.15s; }
        .footer-link:hover { color: var(--green); }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 600px) {
            .page { padding: 2rem 1rem 5rem; }
            .stats { grid-template-columns: 1fr 1fr; }
            .stat:nth-child(3) { border-right: none; border-top: 1px solid var(--border); grid-column: 1 / -1; }
            .header { flex-direction: column; gap: 1rem; }
            .header-right { text-align: left; }
            .pulse-row { justify-content: flex-start; }
        }

        @media (prefers-reduced-motion: reduce) {
            .agent-card { animation: none; opacity: 1; transform: none; }
            .logo-dot, .pulse-dot { animation: none; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="page">

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-mark">
                <span class="logo-dot"></span>
                <span class="logo-dot"></span>
                <span class="logo-dot"></span>
            </div>
            <div class="logo-text">
                <span class="logo-name">EMQUEST</span>
                <span class="logo-sub">em-pop network view</span>
            </div>
        </div>
        <div class="header-right">
            <div class="pulse-row">
                <span class="pulse-dot"></span>
                <span class="status-label">LIVE</span>
            </div>
            <div id="clock" class="clock"></div>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats" id="stats">
        <div class="stat">
            <div class="stat-value" id="stat-peers">—</div>
            <div class="stat-label">peers discovered</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="stat-routable">—</div>
            <div class="stat-label">routable</div>
        </div>
        <div class="stat">
            <div class="stat-value">em-pop</div>
            <div class="stat-label">gossip protocol</div>
        </div>
    </div>

    <!-- Peer list -->
    <div class="section-title">discovered peers</div>
    <div class="agents-grid" id="agents-grid">
        <div style="color:var(--muted);font-size:0.8rem;grid-column:1/-1">Polling peer table…</div>
    </div>

</div>

<!-- Footer -->
<footer class="app-footer">
    <span class="footer-name">EMERGENCE</span>
    <span class="footer-sep">·</span>
    <a href="/" class="footer-link">← search</a>
    <span class="footer-sep">·</span>
    <span id="footer-count" class="footer-info">loading…</span>
</footer>

<script src="/static/network.js?v=1"></script>
</body>
</html>
